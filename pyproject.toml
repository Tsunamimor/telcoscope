[project]
name = "telcoscope"
version = "0.1.0"
description = "Vendor-agnostic 3GPP KPI observability and root-cause analysis for mobile networks"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Paddy McPhillips" }]
keywords = ["telecom", "kpi", "anomaly-detection", "3gpp", "lte", "5g", "rca"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Data
    "polars>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",

    # Database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",

    # Modelling
    "scikit-learn>=1.5",
    "statsforecast>=1.7",
    "scipy>=1.13",

    # Validation & config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",

    # CLI & app
    "typer>=0.12",
    "rich>=13.7",
    "loguru>=0.7",

    # APIs / LLM
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",

    # Viz / dashboard
    "streamlit>=1.35",
    "plotly>=5.20",
    "altair>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
]

[project.scripts]
telcoscope = "telcoscope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telcoscope"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",               # isort
    "B",               # bugbear
    "C4",              # comprehensions
    "UP",              # pyupgrade
    "SIM",             # simplify
    "RUF",             # ruff-specific
    "N",               # pep8-naming
    "D",               # pydocstyle (minimal)
]
ignore = [
    "D100", "D104", "D107",  # missing docstrings on modules/packages/inits
    "E501",                    # line length handled by formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S"]
"notebooks/**" = ["E402", "D"]

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=telcoscope --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker services to be running",
    "slow: tests that take > 1s",
]

[tool.coverage.run]
source = ["src/telcoscope"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
