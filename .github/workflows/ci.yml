name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: telcoscope
          POSTGRES_PASSWORD: telcoscope
          POSTGRES_DB: telcoscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,dbt]"

      - name: Ruff lint
        run: ruff check src tests apps

      - name: Ruff format check
        run: ruff format --check src tests apps

      - name: Mypy
        run: mypy src
        continue-on-error: true  # tighten over time

      - name: Pytest
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: telcoscope_test
          POSTGRES_USER: telcoscope
          POSTGRES_PASSWORD: telcoscope
          NARRATOR_MODE: mock
        run: pytest -v --cov=telcoscope --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  dbt-build:
    name: dbt build (full pipeline)
    runs-on: ubuntu-latest
    needs: lint-and-test

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: telcoscope
          POSTGRES_PASSWORD: telcoscope
          POSTGRES_DB: telcoscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + dbt
        run: pip install -e ".[dev,dbt]"

      - name: Initialise TimescaleDB and schemas
        env:
          PGPASSWORD: telcoscope
        run: |
          psql -h localhost -U telcoscope -d telcoscope_test -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;"
          psql -h localhost -U telcoscope -d telcoscope_test -c "CREATE SCHEMA IF NOT EXISTS raw;"
          psql -h localhost -U telcoscope -d telcoscope_test -c "CREATE SCHEMA IF NOT EXISTS dims;"
          psql -h localhost -U telcoscope -d telcoscope_test -c "CREATE SCHEMA IF NOT EXISTS marts;"
          psql -h localhost -U telcoscope -d telcoscope_test -c "CREATE SCHEMA IF NOT EXISTS analytics;"

      - name: Apply Alembic migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: telcoscope_test
          POSTGRES_USER: telcoscope
          POSTGRES_PASSWORD: telcoscope
        run: alembic upgrade head

      - name: Seed synthetic data (smaller than local — CI-friendly)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: telcoscope_test
          POSTGRES_USER: telcoscope
          POSTGRES_PASSWORD: telcoscope
          SYNTH_NUM_CELLS: 20
          SYNTH_DAYS: 7
        run: python -m telcoscope.synth.generator

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          telcoscope:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: telcoscope
                password: telcoscope
                dbname: telcoscope_test
                schema: dbt_ci
                threads: 4
          EOF

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build (full — models + tests)
        working-directory: dbt
        run: dbt build --target ci